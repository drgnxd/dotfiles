name: Lint Scripts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        run: |
          shellcheck --version
          if [ -z "$(git ls-files '*.sh')" ]; then
            echo "No shell scripts found"
            exit 0
          fi
          git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - name: ShellCheck extensionless scripts
        run: |
          if [ -d scripts/linux ]; then
            shellcheck scripts/linux/hypr-*
          fi

      - name: Check Floorp shared-layer parity drift
        continue-on-error: true
        run: scripts/check-floorp-parity.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - name: Run ruff
        run: |
          uv tool run ruff check dot_config/opencode

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Run actionlint
        run: nix run --inputs-from . nixpkgs#actionlint -- -color

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          config: .typos.toml
