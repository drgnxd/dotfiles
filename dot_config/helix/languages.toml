# Language-specific servers and formatters are resolved from PATH.
# Home Manager keeps global Nix tooling; project devShells provide the rest.

[language-server.r]
command = "R"
args = ["--slave", "-e", "languageserver::run()"]

[language-server.steel-lsp]
command = "steel-language-server"

[language-server.bash-lsp]
command = "bash-language-server"
args = ["start"]

[language-server.docker-lsp]
command = "docker-langserver"
args = ["--stdio"]

[language-server.nixd]
command = "nixd"

[language-server.nixd.config.nixd]
formatting = { command = ["nixfmt"] }
# NOTE: These expressions evaluate the local flake; override per project if needed.
options.nixos.expr = '''
(builtins.getFlake (toString ./.)).darwinConfigurations.darwin.options
'''
options.home-manager.expr = '''
(builtins.getFlake (toString ./.)).homeConfigurations."user@linux".options
'''

[[language]]
name = "bash"
scope = "source.bash"
language-servers = ["bash-lsp"]
auto-format = true

[[language]]
name = "r"
scope = "source.r"
language-servers = ["r"]
formatter = { command = "Rscript", args = [
  "-e",
  "styler::style_file(stdin(), output = stdout(), transformers = styler::tidyverse_style())",
] }
auto-format = true

[[language]]
name = "scheme"
scope = "source.scheme"
injection-regex = "scheme"
file-types = ["scm", "scheme", "libfive"]
comment-token = ";"
indent = { tab-width = 2, unit = "  " }
language-servers = ["steel-lsp"]

[[language]]
name = "c"
language-servers = ["clangd"]

[[language]]
name = "python"
language-servers = ["pyright", "ruff"]

[[language]]
name = "markdown"
language-servers = ["marksman"]

[language.soft-wrap]
enable = true

[[language]]
name = "toml"
language-servers = ["taplo"]

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]

[[language]]
name = "lua"
language-servers = ["lua-language-server"]

[[language]]
name = "typst"
language-servers = ["tinymist"]

[[language]]
name = "latex"
language-servers = ["texlab"]

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]

[[language]]
name = "dockerfile"
language-servers = ["docker-lsp"]
auto-format = true

[[language]]
name = "nix"
language-servers = ["nixd"]
auto-format = true
formatter = { command = "nixfmt" }

[[grammar]]
name = "scheme"
source = { git = "https://github.com/6cdh/tree-sitter-scheme", rev = "af3af6c9356b936f8a515a1e449c32e804c2b1a8" }
